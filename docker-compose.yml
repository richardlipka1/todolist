version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: todolist_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todolist_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - todolist_network

  # PHP Backend
  php:
    image: php:8.1-apache
    container_name: todolist_backend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    networks:
      - todolist_network
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: todolist_db
    command: >
      bash -c "docker-php-ext-install mysqli && apache2-foreground"

  # React Frontend (development)
  frontend:
    image: node:18-alpine
    container_name: todolist_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm start"
    networks:
      - todolist_network
    environment:
      - NODE_ENV=development

volumes:
  db_data:

networks:
  todolist_network:
    driver: bridge
